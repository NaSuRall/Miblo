[package]
name = "miblo"
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
description = "Interactive CLI and terminal UI to generate Rust REST APIs with Axum, SQLx, SQLite and MySQL"
license = "MIT"
repository = "https://github.com/NaSuRall/Miblo"
homepage = "https://cli.miblo.fr"
documentation = "https://cli.miblo.fr/en/docs/"
readme = "README.md"
keywords = ["cli", "tui", "api", "codegen", "axum"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "miblo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29"
shell-words = "1"
libc = "0.2"
anyhow = "1"
flate2 = "1"
handlebars = "6.4.0"
heck = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
dotenvy = "0.15.7"
percent-encoding = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
diffy = { version = "0.4", default-features = false }
matchit = "=0.8.4"
