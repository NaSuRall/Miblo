[package]
name = "miblo_cli_v2"
version = "0.3.0"
edition = "2024"
description = "Terminal workspace for Rust APIs with SQLite or MySQL and remote templates"
license = "MIT"
repository = "https://github.com/NaSuRall/Miblo"
readme = "README.md"
keywords = ["axum", "sqlx", "codegen", "api", "generator"]
categories = ["command-line-utilities", "development-tools"]


[[bin]]
name = "miblo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.29"
shell-words = "1"
libc = "0.2"
anyhow = "1"
flate2 = "1"
handlebars = "6.4.0"
heck = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
dotenvy = "0.15.7"
percent-encoding = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
